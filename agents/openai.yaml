  short_description: "用可视化选项把参考图做成可点击 UI"
  default_prompt: "Use $image-to-ui-skill. When the workflow mode is not already clear, open https://www.ondesign.tech/launcher.html?lang=zh in the host browser (or give it as a clickable link), then use the host's native structured choice UI to ask one question with three options: 截图还原, 参考重设计, 从零创建. Preserve the selected mode and any launcher prompt as the structured intent for the run."
